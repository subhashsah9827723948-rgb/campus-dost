
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dost | Student Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101b46, #176b87);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border-radius: 22px;
      box-shadow: 0 15px 45px #0003;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #142c65;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin: 10px 0 26px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd4e0;
      border-radius: 10px;
      font-size: 16px;
      outline-color: #176bce;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 22px;
      background: #176bce;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1054a8;
    }

    .notice {
      background: #eef5ff;
      color: #254b7a;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 18px;
    }

    #message {
      font-size: 14px;
      line-height: 1.5;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      color: #667085;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">🎓</div>
    <h1>Campus Dost</h1>
    <p class="subtitle">Your campus. Your preparation. Your future.</p>

    <form id="loginForm">
      <label for="studentName">Student Name</label>
      <input
        id="studentName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="Enter your phone number"
        autocomplete="tel"
        required
      >

      <button type="submit">Continue</button>
      <p id="message" role="status"></p>
    </form>

    <div class="notice">
      🔒 Your details should be handled securely.
      Real OTP verification and account creation will
      work after the secure backend is connected.
    </div>

    <footer>© 2026 Campus Dost</footer>
  </main>
  
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAmcYOusLj-QtEHWixUtX6quh3XDs6EvKQ",
    authDomain: "campus-dost-eebfe.firebaseapp.com",
    projectId: "campus-dost-eebfe",
    storageBucket: "campus-dost-eebfe.firebasestorage.app",
    messagingSenderId: "26710716148",
    appId: "1:26710716148:web:5a9aff8b5d41c9f63078a1",
    measurementId: "G-7XZTZMZJE3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  let confirmation = null;
  let recaptcha = null;

  const captchaBox = document.createElement("div");
  captchaBox.id = "recaptcha-container";
  form.appendChild(captchaBox);

  const otpInput = document.createElement("input");
  otpInput.placeholder = "Enter 6-digit OTP";
  otpInput.inputMode = "numeric";
  otpInput.maxLength = 6;
  otpInput.style.display = "none";
  form.appendChild(otpInput);

  const verifyButton = document.createElement("button");
  verifyButton.type = "button";
  verifyButton.textContent = "Verify OTP";
  verifyButton.style.display = "none";
  form.appendChild(verifyButton);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const phone = document.getElementById("phone").value.trim();

    if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
      message.textContent =
        "Enter your phone with country code, e.g. +977XXXXXXXXXX";
      return;
    }

    try {
      message.textContent = "Preparing verification...";

      if (!recaptcha) {
        recaptcha = new RecaptchaVerifier(auth, "recaptcha-container", {
          size: "normal"
        });
      }

      await recaptcha.render();
      message.textContent = "Sending OTP...";

      confirmation = await signInWithPhoneNumber(auth, phone, recaptcha);
      otpInput.style.display = "block";
      verifyButton.style.display = "block";
      message.textContent = "OTP sent. Check your SMS.";
    } catch (error) {
      console.error(error);
      message.textContent = "OTP could not be sent. Check Firebase settings.";
      if (recaptcha) {
        recaptcha.clear();
        recaptcha = null;
      }
    }
  });

  verifyButton.addEventListener("click", async () => {
    if (!confirmation || !/^\d{6}$/.test(otpInput.value.trim())) {
      message.textContent = "Enter the 6-digit OTP.";
      return;
    }

    try {
      const result = await confirmation.confirm(otpInput.value.trim());
      message.textContent = "Phone verified successfully!";
      console.log("User ID:", result.user.uid);
    } catch (error) {
      console.error(error);
      message.textContent = "OTP verification failed. Try again.";
    }
  });
</script>


  
</body>
</html>
